# 在 experiment4 目录运行：docker compose up --build
# 项目根目录（含 data、experiment1、experiment3）以只读方式挂载到 /project。
services:
  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment:
      ECOSORT_REDIS_URL: redis://redis:6379/0
      ECOSORT_CORS: http://localhost:8080
    volumes:
      - ..:/project:ro
      - task-storage:/data/storage
    ports: ["8000:8000"]
    depends_on: [redis]

  worker:
    build: ./backend
    command: celery -A app.celery_app worker -l info --concurrency 1
    environment:
      ECOSORT_REDIS_URL: redis://redis:6379/0
    volumes:
      - ..:/project:ro
      - task-storage:/data/storage
    depends_on: [redis]

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  task-storage:
