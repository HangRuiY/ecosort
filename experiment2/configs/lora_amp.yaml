data: ../../data/split/data.yaml

# 与基线相同，从原始预训练模型开始
model: yolo11n.pt

run:
  project: ../outputs/lora_amp
  name: yolo11n_lora_amp
  exist_ok: false

lora:
  rank: 8
  alpha: 16

train:
  # 与已经完成的基线保持一致
  epochs: 60
  imgsz: 640
  batch: 16
  device: 0
  workers: 4

  seed: 20261003
  deterministic: true
  amp: true
  pretrained: true
  patience: 20

  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true

  cache: false
  plots: true
  save: true
  val: true
  verbose: true
  fraction: 1.0